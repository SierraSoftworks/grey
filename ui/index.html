<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <link rel="shortcut icon" type="image/ico" href="https://cdn.sierrasoftworks.com/logos/icon.ico">
    <!-- Applies a saved light or dark choice before anything is drawn (yewi::THEME_SCRIPT). -->
    <script>
      (function(){try{var t=localStorage.getItem("yewi-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}})()
    </script>
    <!-- The agent links yewi's stylesheet and fonts here when it serves the page (see agent/src/api/page.rs). -->
    <link data-trunk rel="scss" href="styles.scss">
    <link data-trunk rel="rust" data-bin="grey-ui" data-cargo-features="wasm">
</head>
<body></body>
</html>
