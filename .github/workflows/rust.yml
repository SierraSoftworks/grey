name: Rust
on:
  pull_request: {}
  push:
    branches:
      - main
  release:
    types: [published]

env:
  PROTOC_VERSION: "26.0"
  VERSION: "0.0.0-dev"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  APP_NAME: grey

jobs:
  version:
    name: Start Release
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Generate Package Version (Release Tag)
        shell: pwsh
        if: github.event_name == 'release'
        run: Add-Content -Path $env:GITHUB_ENV -Value "VERSION=$('${{ github.event.release.tag_name }}'.substring(1))"

      - name: Set Package Version
        run: sed -i "s/^version\s*=\s*\".*\"/version = \"$VERSION\"/g" Cargo.toml

      - name: Stash Versioned Cargo.toml
        uses: actions/upload-artifact@v7
        with:
          name: cargofile
          path: Cargo.toml

  build-ui:
    name: Build User Interface
    runs-on: macos-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      # Install trunk before switching the default Rust toolchain so that the
      # rustup override doesn't interfere, and pass the GITHUB_TOKEN so that
      # binstall isn't rate-limited by the GitHub API (which forces a slow
      # build from source).
      - name: Install trunk (for building web UI)
        run: cargo binstall --no-confirm trunk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: llvm-tools-preview

      - name: Setup Cache
        uses: Swatinem/rust-cache@v2

      - name: Build UI using trunk
        run: trunk build --release

      - name: Upload build artifacts for use in other build stages
        uses: actions/upload-artifact@v7
        with:
          name: ui-build
          path: ./ui/dist

  test:
    name: Test
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    needs:
      - build-ui

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: install protoc
        uses: SierraSoftworks/setup-protoc@v3.0.1
        with:
          version: ${{ env.PROTOC_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: cargo install grcov
        uses: SierraSoftworks/setup-grcov@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch UI build artifacts
        uses: actions/download-artifact@v8
        with:
          name: ui-build
          path: ./ui/dist

      - name: Setup Cache
        uses: Swatinem/rust-cache@v2

      - name: Run Tests for Grey
        run: cargo test --no-fail-fast -p grey
        env:
            RUSTFLAGS: -Cinstrument-coverage

      - name: Run Tests for Grey UI
        run: cargo test --no-fail-fast -p grey-ui
        env:
          RUSTFLAGS: -Cinstrument-coverage

      - name: Run Tests for Grey API
        run: cargo test --no-fail-fast -p grey-api
        env:
          RUSTFLAGS: -Cinstrument-coverage

      - name: grcov
        run: grcov . --binary-path target/debug/deps/ -s . -t lcov --ignore-not-existing --ignore '../**' --ignore '/*' --ignore 'C:/' -o ./lcov.info

      - name: codecov upload
        uses: codecov/codecov-action@v7.0.0
        with:
          files: ./lcov.info

  build-app:
    name: ${{ matrix.os }}-${{ matrix.arch }}-release
    runs-on: ${{ matrix.run_on }}

    needs:
      - version
      - build-ui

    strategy:
      matrix:
        include:
          # Windows builds
          - arch: amd64
            os: windows
            run_on: windows-latest
            target: x86_64-pc-windows-msvc
            extension: .exe

          # Linux builds
          - arch: amd64
            run_on: ubuntu-latest
            os: linux
            target: x86_64-unknown-linux-gnu
            test: true
          - arch: "arm64"
            os: linux
            run_on: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            cross: true
            flags: --features openssl_src

          # Apple macOS builds
          - arch: amd64
            run_on: macos-latest
            os: darwin
            target: x86_64-apple-darwin
          - arch: arm64
            run_on: macos-latest
            os: darwin
            target: aarch64-apple-darwin

    steps:
      - name: install protoc
        uses: SierraSoftworks/setup-protoc@v3.0.1
        if: ${{ !matrix.cross }}
        with:
          version: ${{ env.PROTOC_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: llvm-tools-preview

      - name: Check out code
        uses: actions/checkout@v7

      # Set up the cache before fetching the versioned Cargo.toml.
      # Swatinem/rust-cache derives its cache key from the contents of
      # Cargo.toml/Cargo.lock, so restoring the version-bumped Cargo.toml first
      # would change the key on release builds and prevent any cache from being
      # restored, forcing a full rebuild every time.
      - name: Setup Cache
        uses: Swatinem/rust-cache@v2
        with:
          # Give each matrix entry its own cache scope. Without this, every
          # entry in the matrix shares the same automatic cache key (derived
          # from the job name + Cargo.lock), so the jobs clobber one another's
          # caches and targets like aarch64 (built via cross) never get a
          # usable cache restored, forcing a full rebuild on every run.
          key: ${{ matrix.target }}

      - name: Fetch Versioned Cargo.toml
        uses: actions/download-artifact@v8
        with:
          name: cargofile

      - name: Fetch UI build artifacts
        uses: actions/download-artifact@v8
        with:
          name: ui-build
          path: ./ui/dist

      - name: Install cross
        if: ${{ matrix.cross }}
        run: cargo install cross --locked

      - name: cargo build
        run: ${{ matrix.cross && 'cross' || 'cargo' }} build --release --target ${{ matrix.target }} ${{ matrix.flags }}

      # cross runs the compiler inside a Docker container as root, so the
      # registry downloads and build artifacts it writes into the cached
      # directories end up owned by root. Swatinem/rust-cache's save step runs
      # as the unprivileged runner user and cannot prune root-owned files,
      # which causes the cache save to fail and the cross build to never be
      # cached. Reclaim ownership so the cache can be persisted.
      - name: Reclaim cache ownership from cross
        if: ${{ matrix.cross }}
        run: sudo chown -R "$(id -u):$(id -g)" "$HOME/.cargo" target

      - name: Upload GitHub Release Artifacts
        uses: SierraSoftworks/gh-releases@v1.0.10
        if: github.event_name == 'release'
        with:
          files: "target/${{ matrix.target }}/release/grey${{ matrix.extension }} | grey-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.extension }}"
          token: ${{ secrets.GITHUB_TOKEN }}
          overwrite: "true"

      # Also uploaded on releases so that the docker-build job can package the
      # linux binaries into the container image.
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        if: github.event_name == 'pull_request' || github.event_name == 'release'
        with:
          name: grey-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.extension }}
          path: target/${{ matrix.target }}/release/grey${{ matrix.extension }}

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs:
      - build-app

    if: github.event_name == 'release'

    permissions:
      contents: read
      packages: write
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]

    steps:
      - name: set environment variables
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

          image="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          image="$(echo $image | tr '[:upper:]' '[:lower:]')"
          echo "FULL_IMAGE_NAME=${image}" >> $GITHUB_ENV

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v4

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.FULL_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Pull in platform artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.APP_NAME }}-${{ env.PLATFORM_PAIR }}

      - name: mark artifact as executable
        run: |
          chmod +x ${{ env.APP_NAME }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.FULL_IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true,annotation-index.org.opencontainers.image.description=Lightweight OpenTelemetry native health probing system

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: image-digest-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-publish:
    name: Docker Publish
    runs-on: ubuntu-latest
    needs:
      - docker-build

    if: github.event_name == 'release'

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: set environment variables
        run: |
          image="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          image="$(echo $image | tr '[:upper:]' '[:lower:]')"
          echo "FULL_IMAGE_NAME=${image}" >> $GITHUB_ENV

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: image-digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.FULL_IMAGE_NAME }}

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.FULL_IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.FULL_IMAGE_NAME }}:${{ steps.meta.outputs.version }}

  tap:
    name: Update Homebrew Tap
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    needs:
      - build-app
    steps:
      - name: Update Homebrew Tap
        uses: SierraSoftworks/actions-tap@v1
        with:
          app-id: ${{ secrets.TAP_APP_ID }}
          private-key: ${{ secrets.TAP_APP_PRIVATE_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          aliases: major minor
